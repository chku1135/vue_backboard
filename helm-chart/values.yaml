image:
  repository: 192.168.56.13:80/vue-project/backend
  tag: latest

# ★ 중요: Harbor 인증 시크릿 추가 (장애 방지)
imagePullSecrets:
  - name: harbor-registry-secret

# 애플리케이션 환경 변수
env:
  SPRING_PROFILES_ACTIVE: prd
  # 외부 DB 연동 (mariadb-external-service.yaml과 이름 일치)
  DB_HOST: mariadb-galera-service
  DB_PORT: "3306"
  DB_USER: root

# 배포 강제 갱신용 타임스탬프 (Jenkins용)
deployment:
  timestamp: "none"

# 서비스 포트
service:
  port: 8080
  loadBalancerIP: "192.168.56.201"
