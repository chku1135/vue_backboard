server:
  port: 8080

spring:
  application:
    name: spring_backboard
  
  # MariaDB Galera Cluster 연동 설정
  datasource:
    url: jdbc:mariadb://192.168.56.21:3306/vue_test_dev?createDatabaseIfNotExist=true
    driver-class-name: org.mariadb.jdbc.Driver
    username: root
    password: root
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect

# Swagger UI 설정
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs
