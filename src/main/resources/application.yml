spring:
  profiles:
    active: dev

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:mariadb://192.168.56.21:3306/vue_test_dev
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}

---
spring:
  config:
    activate:
      on-profile: prd
  datasource:
    url: jdbc:mariadb://mariadb-galera-service:3306/vue_project_prd
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    database-platform: org.hibernate.dialect.MariaDBDialect
    hibernate:
      ddl-auto: update
    show-sql: true
